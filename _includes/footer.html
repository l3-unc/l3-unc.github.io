<footer class="site-footer">
  <div class="wrap">
    <span class="label">Contact</span>
    <address>
      <strong>{{ site.title }}</strong><br>
      {{ site.contact.department }}<br>
      {% for line in site.contact.address %}{{ line }}{% unless forloop.last %}, {% endunless %}{% endfor %}
    </address>
  </div>
</footer>
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
