# Current lab members. Shown on /team/ grouped by `title` (pi, phd, masters, bachelors).
# When someone leaves, move them to alumni.yml (see README).
#
# - name:   Full name (must match the name used in publications.yml so papers link to them)
#   link:   Personal website / LinkedIn / GitHub (optional)
#   photo:  File in images/bios_compressed/ (200x200 square; run compress_bios.sh)
#   info:   Role shown under the name, e.g. "PhD Student"
#   period:
#     start: Year they joined
#   title:  pi | phd | masters | bachelors
#   bio:    (optional) Short blurb, shown for the PI
#   earlier: (optional) Earlier role in the lab, shown under the current one, e.g. "Previously undergrad intern, 2024–2026" (keep it short; it sits under the role line)

- name: Shashank Srivastava
  link: https://www.ssriva.com
  photo: shashank.jpg
  info: Assistant Professor
  period:
    start: 2020
  title: pi
  bio: >-
    Shashank is an Assistant Professor of Computer Science at UNC Chapel Hill. Before joining UNC he was a researcher at Microsoft Research in Redmond. He received his PhD in Machine Learning from Carnegie Mellon University, working with Tom Mitchell. His work explores the connection between natural language and machine intelligence, with a focus on explainability, alignment, and interactive learning.

