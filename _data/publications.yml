- title: 'The Story Shapes the Agent: Narrative Priors in LLM Behavior'
  short: Narrative priors
  image: narrative_priors.png
  description: 'Persona prompting is widely used to steer LLM agent behavior, yet the narrative framing of a task can matter more than the assigned persona. We isolate this effect through structural isomorphism, constructing three text-based investigation games that share the same action space, stage progression, and resource constraints while varying only task narrative: disease investigation, IT troubleshooting, and murder mystery. Across 1,890 sessions spanning 3 models and 10 personas, we identify narrative priors: systematic action tendencies activated by a task’s story framing, independent of its decision structure. Narrative priors explain 5–31× more behavioral variance than persona, are consistent across model architectures, and in two of three domains are negatively associated with task success. Persona effects that do transfer across narratives arise from behavioral anchors, persona descriptions whose language maps directly onto shared actions. Causal interventions confirm this: removing anchor words from a high-transfer persona reduces cross-narrative consistency by 95%. Our framework also generalizes to a held-out fourth narrative and yields a persona-selection method that improves cross-narrative transfer. These results suggest that LLM behavior that survives narrative changes should be grounded in concrete actions rather than abstract descriptions.'
  question: Does the story matter more than the persona?
  finding: Across 1,890 sessions, 3 models, and 10 personas, a task’s narrative framing explained 5–31× more behavioral variance than the assigned persona.
