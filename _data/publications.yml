- title: 'INTERACT: Enabling Interactive, Question-Driven Learning in Large Language Models'
  short: INTERACT
  image: interact.png
  description: Large language models (LLMs) excel at answering questions but remain passive learners—absorbing static data without the ability to question and refine knowledge. This paper explores how LLMs can transition to interactive, question-driven learning through studentteacher dialogues. We introduce INTERACT (INTERactive learning for Adaptive Concept Transfer), a framework in which a “student” LLM engages a “teacher” LLM through iterative inquiries to acquire knowledge across 1,347 contexts, including song lyrics, news articles, movie plots, academic papers, and images. Our experiments show that across a wide range of scenarios and LLM architectures, interactive learning consistently enhances performance, achieving up to a 25% improvement, with ‘cold-start’ student models matching static learning baselines in as few as five dialogue turns. Interactive setups can also mitigate the disadvantages of weaker teachers, showcasing the robustness of question-driven learning
  question: Can language models learn by asking questions?
  finding: In student-teacher dialogue across 1,347 contexts, interactive learning improves performance by up to 25%, and cold-start students match static-learning baselines within five turns.
