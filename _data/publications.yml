- title: 'Fuse to Forget: Bias Reduction and Selective Memorization through Model Fusion'
  image: fuse-to-forget.png
  description: Model fusion aims to aggregate the knowledge of multiple models to enhance performance by combining their weights. In this work, we study the inverse problem -- investigating whether model fusion can reduce unwanted knowledge. We investigate the effects of model fusion in three scenarios -- the learning of shortcuts, social biases, and memorization of training data in fine-tuned language models. Through experiments covering classification and generation, we show that shared knowledge among models is enhanced during model fusion, while unshared knowledge is forgotten. Based on this, we show that model fusion can be a debiasing tool and showcase its efficacy in addressing privacy concerns with language models.
