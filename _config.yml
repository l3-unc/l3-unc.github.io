# Site settings. Change the lab name here and it updates everywhere.
title: Learning from Language Lab (L³)
# Alternative name under consideration: Language and Intelligence Lab. To switch, change `title` here and
# search the repo for the old name (page descriptions in _pages/ and the wordmark in _includes/header.html).
tagline: Understanding how human language and machine intelligence connect
description: >-
  The Learning from Language Lab at UNC Chapel Hill studies the connection between language,
  interaction, and intelligence: interpretability and explainability of large language models,
  faithful reasoning, and models that learn from language and from people.

url: "https://l3-unc.github.io"
baseurl: ""

# Contact (shown in the footer and on the Join page)
contact:
  email: ssrivastava@cs.unc.edu
  department: Department of Computer Science, UNC Chapel Hill
  address:
    - Brooks Computer Science Building
    - 201 S. Columbia St., CB 3175
    - Chapel Hill, NC 27599-3175
  github: https://github.com/l3-unc
  interest_form: https://forms.gle/NwxAUyT1vMxuq8U8A

# Optional group photo shown at the top of the Team page, e.g. /images/group.jpg (leave empty to hide)
group_photo: ""

# Google Analytics 4 measurement ID (e.g. G-XXXXXXXXXX). Leave empty to disable analytics.
# (The old Universal Analytics property UA-82472331-1 stopped collecting data in 2023.)
google_analytics: ""

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - compress_bios.sh
  - compress_slider.sh
  - vendor
  - node_modules
  # Source images are not published; the site uses the optimized copies.
  - images/teampic
  - images/slider
  - images/slider_compressed
  - images/logopic
  - images/lia-icon*.png
  - images/brain-icon*.png
  - images/grail-icon.png
  - images/minimal-icon.png
  - images/pubpic/*.png
  - images/pubpic/*.jpg

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  parse_block_html: true
